# Lalao sur le VPS : nginx sert les fichiers du jeu, le serveur Node (PM2,
# port 5004) ne s'occupe que des parties. certbot ajoute le HTTPS à ce fichier.
server {
    listen 80;
    listen [::]:80;
    server_name lalao.anjahnyony.com;

    root /var/www/lalao/current/client;
    index index.html;

    # Fichiers nommés par Vite d'après leur contenu : ils ne changent jamais.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Modèles 3D : même nom d'une version à l'autre, donc gardés un jour seulement.
    location /models/ {
        default_type model/gltf-binary;
        gzip_types model/gltf-binary;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # Les parties : WebSocket vers le serveur Node.
    location /ws {
        proxy_pass http://127.0.0.1:5004;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        # Une partie peut rester silencieuse un moment : le serveur envoie un ping toutes les 15 s.
        proxy_read_timeout 1h;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:5004;
    }

    # Application d'une seule page : toute autre adresse renvoie index.html, jamais mis en cache.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
